name: Follow the Line tests

on:
  pull_request:
    paths: ["follow-the-line/**", ".github/workflows/follow-the-line.yml"]
  push:
    branches: [main]
    paths: ["follow-the-line/**", ".github/workflows/follow-the-line.yml"]

defaults:
  run:
    working-directory: follow-the-line

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: follow-the-line/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -v
